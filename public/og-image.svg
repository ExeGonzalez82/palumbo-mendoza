<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111111"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f7c915"/>

  <!-- Decorative bottom-right block -->
  <rect x="980" y="490" width="220" height="140" fill="#f7c915" opacity="0.08"/>

  <!-- Yellow accent line top -->
  <rect x="80" y="80" width="48" height="3" fill="#f7c915"/>

  <!-- Tagline -->
  <text x="80" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700"
        fill="#f7c915" letter-spacing="6" text-transform="uppercase" style="text-transform:uppercase">
    HORMIGÓN ELABORADO · MENDOZA
  </text>

  <!-- Main headline line 1 -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900"
        fill="#ffffff" letter-spacing="-2">
    Calidad que resiste
  </text>

  <!-- Main headline line 2 — accent -->
  <text x="80" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900"
        fill="#f7c915" letter-spacing="-2">
    el tiempo.
  </text>

  <!-- Divider -->
  <rect x="80" y="370" width="400" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- Sub text -->
  <text x="80" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400"
        fill="#ffffff" opacity="0.55">
    ISO 9001:2015 · Más de 30 años · Luján de Cuyo, Mendoza
  </text>

  <!-- Domain bottom right -->
  <text x="1120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600"
        fill="#ffffff" opacity="0.3" text-anchor="end">
    palumbomza.com.ar
  </text>

  <!-- P logo mark — top right -->
  <rect x="1060" y="70" width="80" height="80" fill="#f7c915"/>
  <rect x="1080" y="84" width="8" height="52" fill="#111111"/>
  <rect x="1080" y="84" width="34" height="8" fill="#111111"/>
  <rect x="1080" y="108" width="30" height="8" fill="#111111"/>
  <rect x="1106" y="84" width="8" height="32" fill="#111111"/>
</svg>
